<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173b70">
<title>Acceso | Hospital Universitario del Valle · GrisData</title>
<link rel="icon" href="assets/grisdata.png">
<link rel="stylesheet" href="assets/grisdata.css">
<script src="assets/auth.js"></script>
</head>
<body><main>
<div class="topbar"><a class="logo" href="https://www.grisdata.com/index.html#/" title="GrisData"><img src="assets/grisdata.png" alt="GrisData"></a></div>
<section class="card login">
<div class="hl"><img src="assets/huv.png" alt="Hospital Universitario del Valle Evaristo García E.S.E. · 70 años · Acreditación en salud"></div>
<h1>Acceso a proyectos HUV</h1><p class="sb">Gestión Clínica · GrisData</p>
<form id="f"><div><label for="u">Correo institucional</label><input id="u" type="email" autocomplete="username" required></div>
<div><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required></div>
<div class="err" id="err" role="alert"></div><button type="submit" id="b">Iniciar sesión</button></form>
<p class="msg" style="margin-top:14px"><a class="lnk" href="https://www.grisdata.com/index.html#/">← Volver a GrisData</a></p>
</section>
<footer class="ft"><p>© 2026 GrisData. Todos los derechos reservados.</p><p>Diseño de Ing. Diego Campos · GrisData</p></footer>
</main>
<script>
(function(){
 var f=document.getElementById('f'),err=document.getElementById('err'),b=document.getElementById('b');
 GD.me().then(function(u){if(u)location.replace(GD.nextUrl())});
 f.onsubmit=function(e){e.preventDefault();err.textContent='';b.disabled=true;b.textContent='Verificando…';
  GD.login(document.getElementById('u').value.trim(),document.getElementById('p').value)
   .then(function(){location.href=GD.nextUrl()})
   .catch(function(x){err.textContent=x.message;b.disabled=false;b.textContent='Iniciar sesión'})}
})();
</script></body></html>
